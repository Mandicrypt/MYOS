<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#EDEDEA" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='9' fill='none' stroke='%236B8AFD' stroke-width='3'/></svg>" />
    <title>MYOS</title>
    <script>
      // Apply the saved theme before the page draws, so dark mode never flashes white.
      try {
        var saved = JSON.parse(localStorage.getItem('myos:v2') || '{}')
        document.documentElement.dataset.theme = (saved.settings && saved.settings.theme) || 'system'
      } catch (e) {
        document.documentElement.dataset.theme = 'system'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
